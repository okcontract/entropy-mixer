name: Release artifact

on:
  push:
    tags: ["v*"]

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  artifact:
    name: Verify and package release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Match package version to tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "${RELEASE_TAG}"
      - name: Audit dependencies
        run: bun run audit
      - name: Install browser and system dependencies
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Run the release gate
        run: bun run check:release
      - name: Verify reproducible output
        run: bun run verify:reproducible-build
      - name: Write checksums for deployed files
        run: bun run scripts/write-checksums.ts
      - name: Create deterministic release archive
        env:
          ARTIFACT_NAME: entropy-mixer-${{ github.ref_name }}
        run: |
          mkdir -p release
          source_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          tar --sort=name --mtime="@${source_epoch}" --owner=0 --group=0 --numeric-owner -cf - dist | gzip -n > "release/${ARTIFACT_NAME}.tar.gz"
          cd release
          sha256sum "${ARTIFACT_NAME}.tar.gz" > SHA256SUMS
      - name: Record build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/entropy-mixer-${{ github.ref_name }}.tar.gz
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: entropy-mixer-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
